<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maggie and Space — Desvie dos Asteroides</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 18px; color: #fff; font-family: Arial, sans-serif;
    background: radial-gradient(circle at 50% 15%, #25205e, #090a20 65%);
  }
  .game-wrap { width: min(100%, 520px); text-align: center; }
  h1 { margin: 0 0 6px; color: #c7b3ff; font-size: clamp(25px, 6vw, 36px); }
  .subtitle { margin: 0 0 14px; color: #b9d4ff; }
  .hud { display: flex; justify-content: space-between; gap: 10px; margin: 0 0 8px; }
  .pill { background: #17183d; border: 1px solid #6956c5; border-radius: 999px; padding: 8px 14px; }
  .stage { position: relative; overflow: hidden; border: 2px solid #765de0; border-radius: 18px; background: #07091c; box-shadow: 0 0 28px #6244b766; }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 22px; background: #08091dcc;
  }
  .panel { max-width: 330px; }
  .panel h2 { color: #c8adff; margin: 0 0 10px; }
  .panel p { line-height: 1.45; color: #d9ddff; }
  button {
    border: 0; border-radius: 999px; padding: 12px 20px; margin: 5px;
    color: white; font-weight: bold; font-size: 16px; cursor: pointer;
    background: linear-gradient(100deg, #416ee8, #9252d6);
  }
  button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
  .controls { display: flex; justify-content: center; gap: 18px; margin-top: 12px; }
  .controls button { width: 86px; height: 48px; font-size: 22px; touch-action: none; }
  .help { color: #aeb7e8; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<main class="game-wrap">
  <h1>🪐 Maggie and Space</h1>
  <p class="subtitle">Desvie dos asteroides e sobreviva no espaço!</p>
  <div class="hud">
    <div class="pill">⭐ Pontos: <span id="score">0</span></div>
    <div class="pill">🏆 Recorde: <span id="best">0</span></div>
  </div>
  <div class="stage">
    <canvas id="game" width="480" height="620" aria-label="Jogo de nave espacial desviando de asteroides"></canvas>
    <div class="overlay" id="overlay">
      <div class="panel">
        <h2 id="overlayTitle">Pronto para decolar?</h2>
        <p id="overlayText">Desvie dos asteroides. Use as setas do teclado ou os botões na tela para mover a nave.</p>
        <button id="startBtn">Começar jogo 🚀</button>
      </div>
    </div>
  </div>
  <div class="controls" aria-label="Controles do jogo">
    <button id="leftBtn" aria-label="Mover para esquerda">⬅️</button>
    <button id="rightBtn" aria-label="Mover para direita">➡️</button>
  </div>
  <p class="help">Computador: ← → ou A/D · Celular: segure os botões</p>
</main>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('overlayTitle');
  const textEl = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  let best = 0;
  try { best = Number(localStorage.getItem('maggieSpaceBest') || 0); } catch(e) {}
  bestEl.textContent = best;

  const ship = { x: 240, y: 535, w: 38, h: 48, speed: 6 };
  let asteroids = [], stars = [], score = 0, frame = 0, running = false;
  let left = false, right = false, animationId = 0;

  for (let i = 0; i < 75; i++) {
    stars.push({ x: Math.random()*480, y: Math.random()*620, r: Math.random()*1.7+.4, s: Math.random()*1.4+.4 });
  }

  function drawBackground() {
    ctx.fillStyle = '#08091d'; ctx.fillRect(0,0,480,620);
    for (const s of stars) {
      ctx.fillStyle = '#dce5ff';
      ctx.globalAlpha = .45 + Math.sin((frame*s.s)/18)*.35;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      if (running) { s.y += s.s; if (s.y > 620) { s.y = 0; s.x = Math.random()*480; } }
    }
    ctx.globalAlpha = 1;
    // Nebulosas suaves
    const glow = ctx.createRadialGradient(100,130,5,100,130,180);
    glow.addColorStop(0,'#34256b55'); glow.addColorStop(1,'#34256b00');
    ctx.fillStyle = glow; ctx.fillRect(0,0,300,330);
  }

  function drawShip() {
    ctx.save(); ctx.translate(ship.x, ship.y);
    ctx.fillStyle = '#61b8ff';
    ctx.beginPath(); ctx.moveTo(0,-25); ctx.lineTo(19,19); ctx.lineTo(0,11); ctx.lineTo(-19,19); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c9a6ff';
    ctx.beginPath(); ctx.moveTo(0,-17); ctx.lineTo(8,12); ctx.lineTo(0,7); ctx.lineTo(-8,12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f7d6ff'; ctx.beginPath(); ctx.ellipse(0,-3,5,9,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffb45f';
    ctx.beginPath(); ctx.moveTo(-7,16); ctx.lineTo(0,31+Math.random()*7); ctx.lineTo(7,16); ctx.fill();
    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(a.rot);
    ctx.fillStyle = '#8e86a8'; ctx.strokeStyle = '#c3b8e3'; ctx.lineWidth = 2;
    ctx.beginPath();
    for(let i=0;i<9;i++) {
      const ang = i/9*Math.PI*2, rad = a.r*(.78 + .22*Math.sin(i*7+a.seed));
      const x=Math.cos(ang)*rad, y=Math.sin(ang)*rad;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#625c7b';
    ctx.beginPath(); ctx.arc(-a.r*.25,-a.r*.1,a.r*.18,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(a.r*.3,a.r*.25,a.r*.12,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function spawnAsteroid() {
    const r = 17 + Math.random()*15;
    asteroids.push({ x:r+Math.random()*(480-2*r), y:-r, r, speed:2.5+Math.min(score/180,4)+Math.random()*1.4, rot:Math.random()*6, spin:(Math.random()-.5)*.06, seed:Math.random()*10 });
  }

  function hit(a) {
    const dx = Math.abs(a.x-ship.x), dy = Math.abs(a.y-ship.y);
    return dx < a.r*.78 + ship.w*.34 && dy < a.r*.78 + ship.h*.34;
  }

  function endGame() {
    running = false;
    cancelAnimationFrame(animationId);
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('maggieSpaceBest', String(best)); } catch(e) {}
    }
    titleEl.textContent = 'Fim de jogo! 💫';
    textEl.textContent = `Você conseguiu ${score} pontos! Quer tentar bater seu recorde?`;
    startBtn.textContent = 'Jogar novamente 🚀';
    overlay.style.display = 'grid';
  }

  function update() {
    frame++;
    drawBackground();
    if (left) ship.x -= ship.speed;
    if (right) ship.x += ship.speed;
    ship.x = Math.max(24, Math.min(456, ship.x));

    if (frame % Math.max(24, 55-Math.floor(score/90)) === 0) spawnAsteroid();
    for (const a of asteroids) {
      a.y += a.speed; a.rot += a.spin; drawAsteroid(a);
      if (hit(a)) { drawShip(); endGame(); return; }
    }
    asteroids = asteroids.filter(a => {
      if (a.y-a.r > 620) { score += 1; scoreEl.textContent = score; return false; }
      return true;
    });
    drawShip();
    animationId = requestAnimationFrame(update);
  }

  function startGame() {
    cancelAnimationFrame(animationId);
    score = 0; frame = 0; asteroids = []; ship.x = 240;
    scoreEl.textContent = '0'; left = false; right = false;
    overlay.style.display = 'none'; running = true;
    update();
  }

  function keyDown(e) {
    if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') left = true;
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') right = true;
    if (!running && e.key === 'Enter') startGame();
  }
  function keyUp(e) {
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') left = false;
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') right = false;
  }
  function bindHold(id, direction) {
    const btn = document.getElementById(id);
    const on = e => { e.preventDefault(); if(direction==='left') left=true; else right=true; };
    const off = e => { e.preventDefault(); left=false; right=false; };
    btn.addEventListener('pointerdown', on);
    btn.addEventListener('pointerup', off);
    btn.addEventListener('pointerleave', off);
    btn.addEventListener('pointercancel', off);
  }
  document.addEventListener('keydown', keyDown);
  document.addEventListener('keyup', keyUp);
  window.addEventListener('blur', () => { left=false; right=false; });
  bindHold('leftBtn','left'); bindHold('rightBtn','right');
  startBtn.addEventListener('click', startGame);

  // Tela inicial decorativa
  drawBackground(); drawShip();
})();
</script>
</body>
</html>
